#:schema https://mise.jdx.dev/schema/mise-task.json

[upgrade]
usage = '''
arg "<tool>" {
  choices "all" "brew" "mise"
  default "all"
}
'''
run = '''
#!/usr/bin/env bash
exec {{ mise_bin }} run "upgrade:${usage_tool}"
'''

["upgrade:all"]
depends = ["upgrade:*"]
hide = true

["upgrade:brew"]
run = ["brew update", "brew upgrade", "brew cleanup --prune=all"]
hide = true

["upgrade:mise"]
run = ["{{ mise_bin }} upgrade", "{{ mise_bin }} reshim", "{{ mise_bin }} cache prune", "{{ mise_bin }} prune --yes", "{{ mise_bin }} doctor"]
hide = true
