#:schema https://mise.jdx.dev/schema/mise-task.json

[init]
usage = '''
arg "<tool>" {
  choices "all" "codegraph" "grepai" "ir"
  default "all"
}
'''
run = '''
#!/usr/bin/env bash
exec {{ mise_bin }} run -C "${MISE_ORIGINAL_CWD:-$PWD}" "init:${usage_tool}"
'''

["init:codegraph"]
run = ["codegraph init", "codegraph index"]
hide = true

["init:grepai"]
run = ["grepai init"]
hide = true

["init:ir"]
run = ["ir collection add $1 $2", "ir preprocessor bind ko $1"]
hide = true
