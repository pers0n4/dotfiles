[update]
usage = '''
arg "<tool>" {
  choices "all" "antidote" "claude" "skills"
  default "all"
}
'''
run = '''
#!/usr/bin/env bash
exec {{mise_bin}} run "update:${usage_tool}"
'''

["update:all"]
depends = ["update:*"]
hide = true

["update:antidote"]
run = "exec zsh -lc 'source /opt/homebrew/opt/antidote/share/antidote/antidote.zsh; antidote update'"
hide = true

["update:skills"]
run = "bunx skills update --global"
hide = true
