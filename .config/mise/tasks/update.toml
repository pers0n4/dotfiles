[update]
usage = '''
arg "<tool>" {
  choices "all" "antidote" "claude" "codex"
  default "all"
}
'''
run = '''
#!/usr/bin/env bash
exec {{mise_bin}} run "update:${usage_tool}"
'''

["update:all"]
depends = ["update:*"]
hide = true

["update:antidote"]
run = "exec zsh -lc 'source /opt/homebrew/opt/antidote/share/antidote/antidote.zsh; antidote update'"
hide = true

["update:claude"]
run = "claude update && claude plugin marketplace update"
hide = true

["update:codex"]
run = "codex update"
hide = true
