min_version = "2026.10.0"

[env]
_.file = [
  "{{xdg_config_home}}/mise/.env",
  "{{xdg_config_home}}/mise/.env.local",
  "{{config_root}}/.env",
  "{{config_root}}/.env.local",
]
_.path = ["/opt/homebrew/opt/libpq/bin"]
_.python.venv = { path = "{{xdg_data_home}}/mise/venvs/global", create = true, uv_create_args = ["--seed"] }

UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
IR_CONFIG_DIR = "{{xdg_config_home}}/ir"

[tools]
# Runtimes
bun = "latest"
go = "latest"
java = "temurin-25"
node = "lts"
python = "3.12"
rust = { version = "latest", components = "rust-analyzer" }

# mise support
cargo-binstall = "latest"  # https://mise.jdx.dev/tips-and-tricks.html#cargo-binstall
usage = "latest"  # https://mise.jdx.dev/installing-mise.html#autocompletion
watchexec = "latest"  # https://mise.jdx.dev/cli/watch.html#mise-watch

# Package managers
pnpm = "latest"
uv = "latest"

# Git
git-cliff = "latest"
prek = "latest"
# pre-commit = "latest"  # use prek

# Formatters and linters
editorconfig-checker = "latest"  # *
hadolint = "latest"  # Dockerfile Containerfile
lychee = "latest"  # .md .mdx .html .htm .txt .xml
ruff = "latest"  # .py .pyi .ipynb
rumdl = "latest"  # .md .mdx .markdown
shellcheck = "latest"  # .sh .bash .ksh
shfmt = "latest"  # .sh .bash .bats
# "pipx:sqlfluff" = "latest"  # .sql
# "pipx:sqruff" = "latest"  # .sql
tombi = "latest"  # .toml
typos = "latest"  # *
yamlfmt = "latest"  # .yaml .yml
yamllint = "latest"  # .yaml .yml

# Language servers
"pipx:pyright" = "latest"
"npm:typescript-language-server" = "latest"

# Security
betterleaks = "latest"  # *
# gitleaks = "latest"  # use betterleaks
osv-scanner = "latest"  # uv.lock requirements.txt package-lock.json pnpm-lock.yaml bun.lock go.mod Cargo.lock pom.xml gradle.lockfile
zizmor = "latest"  # .github/workflows/*.yml action.yml dependabot.yml .pre-commit-config.yaml

# AI and agent tooling
"npm:gajae-code" = { version = "latest", postinstall = "gjc session list" }
oh-my-pi = "latest"
ollama = "latest"
pi = "latest"
"pypi:git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref" = "main"

# Memory and knowledge
"npm:claude-mem" = "latest"
"github:vlwkaos/ir" = "latest"

# Browser and content extraction
agent-browser = { version = "latest", postinstall = "agent-browser install" }
"npm:defuddle" = "latest"

# Code exploration and search
ast-grep = "latest"
# "github:DeusData/codebase-memory-mcp" = { version = "latest", platforms = { macos-arm64 = { asset_pattern = "codebase-memory-mcp-ui-darwin-arm64.tar.gz" } }, postinstall = "codebase-memory-mcp install" }
codegraph = "latest"
"pipx:graphifyy" = { version = "latest", extras = "pdf,office,mcp,ollama,sql,postgres" }

[settings]
env_shell_expand = true
npm.package_manager = "bun"
pipx.uvx = true
python.uv_venv_auto = "create|source"
minimum_release_age_excludes = ["*pers0n4/*", "npm:gajae-code"]

[settings.status]
show_env = false
show_tools = false
truncate = true

[settings.github]
credential_command = "gh auth token"

[shell_alias]
mr = "{{mise_bin}} run"
mx = "{{mise_bin}} exec"
gj = "gjc --mcp-config=$HOME/.gjc/agent/mcp.json"