min_version = "2026.6.0"

[env]
_.file = [
  "{{xdg_config_home}}/mise/.env",
  "{{xdg_config_home}}/mise/.env.local",
  "{{config_root}}/.env",
  "{{config_root}}/.env.local",
]
_.path = [
  "{{env.HOME}}/.agentmemory/bin",
]
_.python.venv = { path = "{{xdg_data_home}}/mise/venvs/global", create = true, uv_create_args = ["--seed"] }

NODE_ENV = "{{ get_env(name='NODE_ENV', default='local') }}"
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[tools]
python = "{{ get_env(name='PYTHON_VERSION', default='3.12') }}"
node = "{{ get_env(name='NODE_VERSION', default='lts') }}"
deno = "latest"
bun = "latest"
go = "latest"
rust = "latest"
java = "temurin-21"

usage = "latest"  # https://mise.jdx.dev/installing-mise.html#autocompletion
watchexec = "latest"  # https://mise.jdx.dev/cli/watch.html#mise-watch
cargo-binstall = "latest"  # https://mise.jdx.dev/tips-and-tricks.html#cargo-binstall

pnpm = "latest"
uv = "latest"

cocogitto = "latest"
git-cliff = "latest"
prek = "latest"
# pre-commit = "latest"

shfmt = "latest"
# "pipx:sqruff" = "latest"
# "pipx:sqlfluff" = "latest"

claude-code = "latest"
ollama = "latest"

"npm:oh-my-openagent" = "latest"
"npm:oh-my-claude-sisyphus" = "latest"
"npm:oh-my-codex" = "latest"
"npm:lazycodex-ai" = { version = "latest", postinstall = "npx lazycodex-ai install --no-tui --codex-autonomous" }
"npm:gajae-code" = "latest"
# "npm:bmad-method" = "latest"
# "pipx:specify-cli" = "latest"

"npm:@agentmemory/agentmemory" = "latest"
"npm:@colbymchenry/codegraph" = { version = "latest", postinstall = "codegraph install --target=claude,codex --location=global --yes" }
"pipx:graphifyy" = { version = "latest", extras = "pdf,office,mcp,ollama,sql,postgres", postinstall = "graphify install && graphify install --platform codex" }
"pipx:serena-agent" = { version = "latest", postinstall = "serena setup claude-code && serena setup codex" }
"rtk" = { version = "latest", postinstall = "rtk init -g && rtk init -g --codex" }

"npm:agent-browser" = { version = "latest", postinstall = "agent-browser install" }
"npm:defuddle" = "latest"
# "github:dolthub/dolt" = "latest"
# "github:gastownhall/beads" = "latest"
# "github:Dicklesworthstone/beads_rust" = "latest"

ast-grep = "latest"
"npm:typescript-language-server" = "latest"
"pipx:pyright" = "latest"

"npm:tokscale" = "latest"
"npm:codeburn" = "latest"

[tools.iii]
version = "0.11.2"
version_prefix = "iii/v"
platforms = { macos-arm64 = { asset_pattern = "iii-aarch64-apple-darwin.tar.gz" }}

[tools.iii-console]
version = "0.11.2"
version_prefix = "iii/v"
platforms = { macos-arm64 = { asset_pattern = "iii-console-aarch64-apple-darwin.tar.gz" }}

[tool_alias]
iii = "github:iii-hq/iii"
iii-console = "github:iii-hq/iii"

[settings]
env_shell_expand = true
npm.package_manager = "bun"
pipx.uvx = true
python.uv_venv_auto = "create|source"

[settings.status]
show_env = true
show_tools = true
truncate = true

[shell_alias]
mr = "{{mise_bin}} run"
mx = "{{mise_bin}} exec"
